name: notre-nid

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notre_nid
      POSTGRES_PASSWORD: notre_nid_dev_password
      POSTGRES_DB: notre_nid
    ports:
      - '5432:5432'
    volumes:
      - notre_nid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notre_nid -d notre_nid']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  # Stockage S3-compatible pour simuler les uploads d'images en local.
  # Optionnel pour la Phase 1 (aucun upload n'est encore implémenté).
  # Démarrer avec : docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ['storage']
    environment:
      MINIO_ROOT_USER: notre_nid_minio
      MINIO_ROOT_PASSWORD: notre_nid_minio_password
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - notre_nid_minio_data:/data

volumes:
  notre_nid_postgres_data:
  notre_nid_minio_data:
